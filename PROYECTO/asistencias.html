<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencias - ULEAM</title>
    <link rel="stylesheet" href="styless.css">
</head>
<body>
    <div class="dashboard-container">
        <nav class="sidebar">
            <div class="logo-sidebar">
                <img src="ULEAM.png" alt="ULEAM">
            </div>
            
            <ul class="menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="estudiantes.html">Estudiantes</a></li>
                <li><a href="asistencias.html" class="active">Asistencias</a></li>
                <li><a href="materias.html">Materias</a></li>
                <li><a href="reportes.html">Reportes</a></li>
            </ul>
            
            <div class="user-info">
                <p>Docente: Juan Pérez</p>
                <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </nav>
        
        <main class="main-content">
            <header class="top-bar">
                <h1>Control de Asistencias</h1>
            </header>
            <form id="formAsistencia">
                <div class="attendance-controls">
                    <div class="form-group">
                        <label for="materiaAsistencia">Materia:</label>
                        <select id="materiaAsistencia" class="select-styled" required>
                            <option value="">Seleccione una materia</option>
                            <option value="prog-web">Algoritmos y Programación</option>
                            <option value="base-datos">Análisis y Diseño de Base de Datos</option>
                            <option value="redes">Redes de Computadoras</option>
                            <option value="web">Aplicaciones Web I</option>
                            
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="fechaAsistencia">Fecha:</label>
                        <input type="date" id="fechaAsistencia" class="input-styled" required>
                    </div>
                    <button type="submit" class="btn-primary btn-cargar">Registrar Asistencia</button>
                </div>
            </form>
            
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Nombre/Apellidos</th>
                            <th>Correo institucional</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody">
                        <!--Se llena dinamicamente -->
                    </tbody>
                </table>
            </div>
            <button type="button" class="btn-save-attendance" onclick="saveAttendance()">Guardar Asistencia</button>
        </main>
    </div>
    <!-- MODAL CERRAR SESIÓN -->
    <div id="modalCerrarSesion" class="modal-flotante" style="display: none;">
        <div class="modal-contenido">
            <p>¿Estás seguro de cerrar sesión?</p>
            <div class="modal-botones">
                <button id="btnConfirmarCerrar" class="btn-confirmar">Confirmar</button>
                <button id="btnCancelarCerrar" class="btn-cancelar">Cancelar</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
